# Standalone sibling on the candidate network. The data-api proxy owns TLS.
service: geomg-admin-alpha
image: <%= ENV.fetch("GEOMG_ADMIN_IMAGE", "ewlarson/geomg-admin") %>
require_destination: true
servers:
  web:
    hosts:
      - <%= ENV.fetch("KAMAL_HOST") %>
    proxy: false
    options:
      network-alias: geomg-admin-alpha
    cmd: uvicorn app.main:app --host 0.0.0.0 --port 8000 --root-path /admin --workers 2
builder:
  arch: amd64
  dockerfile: <%= File.file?("admin/Dockerfile") ? "admin/Dockerfile" : "Dockerfile" %>
  context: <%= File.file?("admin/Dockerfile") ? "admin" : "." %>
  target: production
  args:
    VITE_ADMIN_BASE: /admin/
ssh:
  user: <%= ENV.fetch("KAMAL_SSH_USER") %>
registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD
env:
  clear:
    AUTH_MODE: local-password
    CORS_ORIGINS: https://<%= ENV.fetch("KAMAL_HOST") %>
  secret:
    - DATABASE_URL
<% if ENV["GEOMG_CUTOVER_BRIDGE"] == "true" %>
    - ALPHA_BRIDGE_TOKEN_SHA256
    - ALPHA_BRIDGE_TOKEN_EXPIRES_AT
<% end %>
